# Overrides the core gateway's catch-all (conf.d/routes/90-root.conf): everything that isn't an
# explicit API/docs route is served by the SPA container — static assets and client-side routes.
# The core explicit routes (/api/, /swagger, /openapi, …) still win via longest-prefix matching.
#
# The `frontend` host is resolved at REQUEST time (Docker's embedded DNS at 127.0.0.11) via a
# variable in proxy_pass — NOT at config-load time. This is deliberate: it lets the gateway start
# even when the SPA container is down (a static `upstream`/`proxy_pass http://frontend` would make
# nginx fail to load and crash-loop the gateway, taking oauth2-proxy down with it). When the SPA is
# absent, `/` simply returns 502 until it's back. See upstreams/frontend.conf for the full rationale.
resolver 127.0.0.11 valid=10s ipv6=off;

location / {
    # Variable → deferred DNS; no URI part → the original request URI is passed through unchanged.
    set $spa_upstream frontend:80;
    proxy_pass http://$spa_upstream;
}
