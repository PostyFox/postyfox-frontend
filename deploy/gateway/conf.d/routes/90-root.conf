# Overrides the core gateway's catch-all (conf.d/routes/90-root.conf): everything that isn't an
# explicit API/docs route is served by the SPA container — static assets and client-side routes.
# The core explicit routes (/api/, /swagger, /openapi, …) still win via longest-prefix matching.
#
# `frontend` is resolved at REQUEST time via a variable in proxy_pass — NOT at config-load time —
# so the gateway starts even when the SPA container is down (a static upstream/`proxy_pass
# http://frontend` would make nginx fail to load and crash-loop the gateway, taking oauth2-proxy
# with it). When the SPA is absent, `/` simply returns 502 until it's back. See
# upstreams/frontend.conf.
#
# The `resolver` this needs is provided by core's gateway in http context (generated from
# /etc/resolv.conf by 40-resolver.envsh, so it's correct on both Docker and podman) — do NOT add a
# hardcoded `resolver 127.0.0.11` here; that is Docker-only and is refused under podman.
location / {
    # Variable → deferred DNS; no URI part → the original request URI is passed through unchanged.
    set $spa_upstream frontend:80;
    proxy_pass http://$spa_upstream;
}
