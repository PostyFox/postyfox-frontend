# SPA upstream intentionally left empty — do NOT declare `upstream frontend { server frontend:80; }`
# here.
#
# nginx resolves the hostnames in `upstream … { server <name>; }` blocks at CONFIG-LOAD time, so a
# static upstream makes the WHOLE gateway fail to start whenever the SPA container is down — e.g. a
# core redeploy that restarts the gateway while the frontend is stopped/crashed (nginx aborts with
# "host not found in upstream 'frontend'", and oauth2-proxy, which depends on the gateway, goes with
# it).
#
# Instead the root route (routes/90-root.conf) resolves `frontend` at REQUEST time via a variable in
# proxy_pass, using the http-context `resolver` that core's gateway generates from /etc/resolv.conf
# (40-resolver.envsh) — correct on both Docker and podman. The gateway then always loads; `/` just
# returns 502 until the SPA is back. This file is kept (rather than deleted) so the deploy's fixed
# fragment list is unchanged and it overrides core's placeholder of the same name.
