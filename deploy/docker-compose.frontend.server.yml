# Server/CI overlay that adds the PostyFox SPA to the core platform stack.
#
# Unlike docker-compose.frontend.yml (local dev, which BUILDS the image), this pulls a prebuilt
# image from GHCR — published by the frontend CI, tagged with the commit SHA. It is layered on top
# of core's compose files and run inside the SAME compose project as core (COMPOSE_PROJECT_NAME=
# postyfox-dev / -prod) so the SPA container shares core's network and the gateway can resolve it.
#
# Deployed by .github/workflows/deploy.yml, from core's deploy directory on the server
# (/opt/postyfox/<env>), e.g.:
#
#   export FRONTEND_IMAGE_REPOSITORY=ghcr.io/postyfox/postyfox-frontend
#   export FRONTEND_IMAGE_TAG=<sha>
#   export COMPOSE_PROJECT_NAME=postyfox-dev
#   docker compose \
#     -f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml \
#     up -d --no-deps frontend
#   docker compose ... restart gateway   # reload conf.d to pick up the SPA upstream + root route
#
# The gateway routing is NOT declared here. Its two fragments —
#   gateway/conf.d/upstreams/frontend.conf  (SPA upstream)
#   gateway/conf.d/routes/90-root.conf      (root → SPA, shadows core's core-only catch-all)
# — are dropped onto the server into core's bind-mounted gateway/conf.d and picked up by a
# `restart gateway`, mirroring how core reloads its own gateway on deploy.
services:
  frontend:
    image: "${FRONTEND_IMAGE_REPOSITORY:-ghcr.io/postyfox/postyfox-frontend}:${FRONTEND_IMAGE_TAG:-latest}"
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
