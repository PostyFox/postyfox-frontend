# SPA-aware replacement for the PostyFox core gateway (deploy/gateway/nginx.conf).
#
# Sits behind oauth2-proxy and path-routes:
#   /api/posts, /api/webhooks  -> post-api
#   /api/*                     -> core-api
#   /swagger*, /openapi*       -> the API that owns each (docs)
#   everything else            -> the frontend SPA container
#
# The full request path is preserved (oauth2-proxy's own sub-path upstreams would not), and the
# original Host/scheme forwarded from the public TLS edge are kept intact.
events {}
http {
  upstream core { server core-api:8080; }
  upstream post { server post-api:8080; }
  upstream frontend { server frontend:80; }

  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Gateway's own liveness (for the container healthcheck).
    location = /healthz { access_log off; return 200 "ok\n"; }

    # post-api owns these paths.
    location /api/posts    { proxy_pass http://post; }
    location /api/webhooks { proxy_pass http://post; }
    location /swagger-post  { proxy_pass http://post; }
    location /openapi-post  { proxy_pass http://post; }

    # core-api owns the rest of the API surface + its own docs. The trailing slash keeps SPA
    # routes that merely start with "api" (e.g. none today, but future-proofed) from being
    # captured as API traffic — only genuine /api/* paths route to the backend.
    location /api/         { proxy_pass http://core; }
    location /swagger       { proxy_pass http://core; }
    location /openapi       { proxy_pass http://core; }

    # Everything else is the SPA (static assets + client-side routes).
    location / { proxy_pass http://frontend; }
  }
}
