# Production values for the postyfox-frontend Helm chart.
# This file should be used when deploying to production environments.

image:
  registry: ghcr.io
  repository: postyfox/postyfox-core
  # tag is set via --set image.tag at deploy time
  pullPolicy: IfNotPresent

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []

# Resource limits and requests for production
resources:
  limits:
    cpu: "500m"
    memory: 512Mi
  requests:
    cpu: "100m"
    memory: 128Mi

# Number of replicas for production
replicaCount: 2
