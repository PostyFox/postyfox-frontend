# Overlay that adds the PostyFox SPA to the core platform stack and re-points the gateway at it.
#
# Run it *from the core deploy directory* alongside the core compose file, pointing at this repo:
#
#   cd ../postyfox-core/deploy
#   docker compose \
#     -f docker-compose.yml \
#     -f ../../postyfox-frontend/deploy/docker-compose.frontend.yml \
#     up --build
#
# Then log in at http://localhost:4180 — oauth2-proxy runs the Keycloak OIDC exchange and forwards
# you to the SPA, with /api/* proxied to the backends carrying the validated bearer token.
#
# Paths below are relative to THIS file (compose resolves build contexts relative to the file that
# declares them), so it works regardless of the directory you invoke compose from.
services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_ENV: production
    expose:
      - "80"

  # Swap the gateway config for the SPA-aware one and make it wait for the frontend.
  gateway:
    volumes:
      - "../deploy/gateway.nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      frontend:
        condition: service_started
