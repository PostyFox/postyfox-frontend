# nginx config for the PostyFox SPA container.
#
# This container only serves the built static assets. In a real deployment it sits *behind* the
# oauth2-proxy edge + gateway (see docs/DEPLOYMENT.md): the gateway path-routes `/api/*` and
# `/oauth2/*` elsewhere and forwards everything else here. So this server never sees API traffic —
# its only job is to return static files and fall back to index.html for client-side routes.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets (Angular hashes filenames in production builds).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the app shell so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — deep links (/connectors, /posts/:id, …) resolve to the Angular app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container liveness probe.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
