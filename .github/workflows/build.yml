name: Build

# Validates, then builds and pushes the image to GHCR tagged with the full commit SHA.
# Deploy only ever ships images built here; production only accepts builds of main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/pr.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version (Conventional Commits)
        id: semver
        uses: paulhatch/semantic-version@v6.0.5
        with:
          tag_prefix: "v"
          # `type!:` or BREAKING CHANGE -> major; `feat:` -> minor; else patch
          major_pattern: '/^\w+(\(.+\))?!:|BREAKING CHANGE/'
          minor_pattern: '/^feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: true
      # baked into the image; Deploy reads it back to name the optional release tag
      - name: Stamp build
        id: version
        env:
          SEMVER: ${{ steps.semver.outputs.version }}
        run: echo "version=${SEMVER}+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  image:
    needs: [validate, version]
    permissions:
      contents: read
      packages: write
    uses: aneillans/github-templates/.github/workflows/docker-build-push.yml@v1
    with:
      registry: ghcr.io
      registry_username: ${{ github.actor }}
      image_name: postyfox/postyfox-frontend
      build_args: |
        BUILD_ENV=production
        VERSION=${{ needs.version.outputs.version }}
    secrets:
      registry_password: ${{ secrets.GITHUB_TOKEN }}
