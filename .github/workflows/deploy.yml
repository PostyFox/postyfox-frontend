name: deploy

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:

  workflow_run:
    workflows: [frontend-ci]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  check-prerequisites:
    # Verify all required secrets are configured
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=0

          if [ -z "$DEPLOY_HOST" ]; then
            echo "❌ Missing required secret: DEPLOY_HOST"
            missing=1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "❌ Missing required secret: DEPLOY_USER"
            missing=1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "❌ Missing required secret: DEPLOY_SSH_KEY"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Configure them in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "✅ Required deployment secrets are configured"

  validate-image:
    # Manual deploys target the exact commit selected in the dispatch UI. Verify its CI run and
    # image before occupying the self-hosted deployment runner.
    needs: check-prerequisites
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: read
    outputs:
      repository: ${{ steps.image.outputs.repository }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Resolve image
        id: image
        env:
          IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Require a successful CI build for the selected commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          runs="$(gh api \
            --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/frontend-ci.yml/runs" \
            -f "head_sha=$IMAGE_TAG" \
            -f status=success \
            -f per_page=100 \
            --jq '[.workflow_runs[] | select(.head_sha == env.IMAGE_TAG and (.event == "push" or .event == "workflow_dispatch"))] | length')"
          if [ "$runs" -eq 0 ]; then
            echo "::warning::Commit $IMAGE_TAG has no successful frontend-ci image build."
            echo "::warning::Run frontend-ci for the target branch before deploying."
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the deployable image
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
        run: |
          if ! docker buildx imagetools inspect "$IMAGE" >/dev/null; then
            echo "::warning::Deployable image $IMAGE does not exist or is not accessible."
            echo "::warning::Run frontend-ci for the target branch before deploying."
            exit 1
          fi

  deploy-dev:
    # Always deploy dev when the CI image build succeeds on a push.
    needs: validate-image
    runs-on: [self-hosted]
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-image.outputs.tag }}

      - name: Copy deployment files
        run: |
          echo "📦 Copying frontend overlay + gateway fragments to dev stack..."
          # The runner is already on the deployment node, so write directly into the local core stack.
          mkdir -p /opt/postyfox/dev/gateway/conf.d/upstreams /opt/postyfox/dev/gateway/conf.d/routes
          cp deploy/docker-compose.frontend.server.yml /opt/postyfox/dev/
          cp deploy/gateway/conf.d/upstreams/frontend.conf /opt/postyfox/dev/gateway/conf.d/upstreams/frontend.conf
          cp deploy/gateway/conf.d/routes/90-root.conf /opt/postyfox/dev/gateway/conf.d/routes/90-root.conf

      - name: Deploy frontend to dev stack
        env:
          IMAGE_REPOSITORY: ${{ needs.validate-image.outputs.repository }}
          IMAGE_TAG: ${{ needs.validate-image.outputs.tag }}
        run: |
          echo "🚀 Deploying frontend to dev stack..."
          set -e
          cd /opt/postyfox/dev
          echo '📋 Checking .env file exists...'
          [ -f .env ] || { echo '❌ Missing .env file (core stack not initialised?)'; exit 1; }
          source .env 2>/dev/null || true
          export FRONTEND_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
          export FRONTEND_IMAGE_TAG=${{ env.IMAGE_TAG }}
          export COMPOSE_PROJECT_NAME=postyfox-dev
          COMPOSE_FILES='-f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml'
          echo '🔄 Pulling frontend image...'
          docker compose $COMPOSE_FILES pull frontend || { echo '❌ Failed to pull frontend image'; exit 1; }
          echo '⬆️ Updating frontend service...'
          docker compose $COMPOSE_FILES up -d --no-deps frontend || { echo '❌ Failed to start frontend'; exit 1; }
          echo '🔄 Reloading gateway (conf.d fragments are bind-mounted; restart picks up the SPA route)...'
          docker compose $COMPOSE_FILES restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }
          echo '✅ Dev frontend deployed successfully'
          docker compose $COMPOSE_FILES ps frontend gateway || {
            echo "❌ Dev deployment failed"
            exit 1
          }

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          sleep 10
          cd /opt/postyfox/dev && \
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml ps frontend | grep -E '(Up|healthy)' || { \
          echo '⚠️ Warning: frontend may not be healthy yet'; }; \
          true

      - name: Deployment summary
        if: success()
        run: |
          cat << 'EOF'
          ✅ Dev frontend deployment completed successfully!

          📊 Stack Information:
          - Environment: Development (auto-deploy on every push)
          - Project: postyfox-dev
          - Location: /opt/postyfox/dev
          - Image: ${{ needs.validate-image.outputs.repository }}:${{ needs.validate-image.outputs.tag }}

          📝 Check logs:
          - cd /opt/postyfox/dev && docker compose logs -f frontend
          EOF
