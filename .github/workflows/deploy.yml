name: deploy

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:

  workflow_run:
    workflows: [frontend-ci]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  check-prerequisites:
    # Verify all required secrets are configured
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        run: |
          missing=0

          if [ -z "$DEPLOY_HOST" ]; then
            echo "❌ Missing required secret: DEPLOY_HOST"
            missing=1
          fi

          if [ -z "$DEPLOY_USER" ]; then
            echo "❌ Missing required secret: DEPLOY_USER"
            missing=1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "❌ Missing required secret: DEPLOY_SSH_KEY"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Configure them in: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "✅ Required deployment secrets are configured"

  deploy-dev:
    # Always deploy dev when the CI image build succeeds on a push.
    needs: check-prerequisites
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: [self-hosted]
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image repository
        id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
            import json
            import os
            import urllib.request

            token = os.environ["GITHUB_TOKEN"]
            repo = os.environ["GITHUB_REPOSITORY"]
            url = f"https://api.github.com/repos/{repo}/actions/workflows/frontend-ci.yml/runs?branch=main&status=success&per_page=1"
            req = urllib.request.Request(
                url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                },
            )

            with urllib.request.urlopen(req) as response:
              payload = json.load(response)

            runs = payload.get("workflow_runs", [])
            if not runs:
              raise SystemExit("No successful frontend-ci run found on main")

            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={runs[0]['head_sha']}\n")
            PY
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Copy deployment files
        run: |
          echo "📦 Copying frontend overlay + gateway fragments to dev stack..."
          # The runner is already on the deployment node, so write directly into the local core stack.
          mkdir -p /opt/postyfox/dev/gateway/conf.d/upstreams /opt/postyfox/dev/gateway/conf.d/routes
          cp deploy/docker-compose.frontend.server.yml /opt/postyfox/dev/
          cp deploy/gateway/conf.d/upstreams/frontend.conf /opt/postyfox/dev/gateway/conf.d/upstreams/frontend.conf
          cp deploy/gateway/conf.d/routes/90-root.conf /opt/postyfox/dev/gateway/conf.d/routes/90-root.conf

      - name: Deploy frontend to dev stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "🚀 Deploying frontend to dev stack..."
          set -e
          cd /opt/postyfox/dev
          echo '📋 Checking .env file exists...'
          [ -f .env ] || { echo '❌ Missing .env file (core stack not initialised?)'; exit 1; }
          source .env 2>/dev/null || true
          export FRONTEND_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
          export FRONTEND_IMAGE_TAG=${{ env.IMAGE_TAG }}
          export COMPOSE_PROJECT_NAME=postyfox-dev
          COMPOSE_FILES='-f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml'
          echo '🔄 Pulling frontend image...'
          docker compose $COMPOSE_FILES pull frontend || { echo '❌ Failed to pull frontend image'; exit 1; }
          echo '⬆️ Updating frontend service...'
          docker compose $COMPOSE_FILES up -d --no-deps frontend || { echo '❌ Failed to start frontend'; exit 1; }
          echo '🔄 Reloading gateway (conf.d fragments are bind-mounted; restart picks up the SPA route)...'
          docker compose $COMPOSE_FILES restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }
          echo '✅ Dev frontend deployed successfully'
          docker compose $COMPOSE_FILES ps frontend gateway || {
            echo "❌ Dev deployment failed"
            exit 1
          }

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          sleep 10
          cd /opt/postyfox/dev && \
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml ps frontend | grep -E '(Up|healthy)' || { \
          echo '⚠️ Warning: frontend may not be healthy yet'; }; \
          true

      - name: Deployment summary
        if: success()
        run: |
          cat << 'EOF'
          ✅ Dev frontend deployment completed successfully!

          📊 Stack Information:
          - Environment: Development (auto-deploy on every push)
          - Project: postyfox-dev
          - Location: /opt/postyfox/dev
          - Image: ${{ steps.image.outputs.repository }}:${{ steps.tag.outputs.tag }}

          📝 Check logs:
          - cd /opt/postyfox/dev && docker compose logs -f frontend
          EOF

  deploy-prod:
    # Deploy to prod after dev succeeds; GitHub environment protection handles approval.
    needs: [check-prerequisites, deploy-dev]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image repository
        id: image
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
            import json
            import os
            import urllib.request

            token = os.environ["GITHUB_TOKEN"]
            repo = os.environ["GITHUB_REPOSITORY"]
            url = f"https://api.github.com/repos/{repo}/actions/workflows/frontend-ci.yml/runs?branch=main&status=success&per_page=1"
            req = urllib.request.Request(
                url,
                headers={
                    "Authorization": f"Bearer {token}",
                    "Accept": "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                },
            )

            with urllib.request.urlopen(req) as response:
              payload = json.load(response)

            runs = payload.get("workflow_runs", [])
            if not runs:
              raise SystemExit("No successful frontend-ci run found on main")

            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={runs[0]['head_sha']}\n")
            PY
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy deployment files
        run: |
          echo "📦 Copying frontend overlay + gateway fragments to prod stack..."
          ssh -p ${{ env.DEPLOY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "mkdir -p /opt/postyfox/prod/gateway/conf.d/upstreams /opt/postyfox/prod/gateway/conf.d/routes" || {
            echo "❌ Failed to ensure gateway conf.d directories exist"
            exit 1
          }
          scp -P ${{ env.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            deploy/docker-compose.frontend.server.yml \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/postyfox/prod/ || { echo "❌ Failed to copy compose overlay"; exit 1; }
          scp -P ${{ env.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            deploy/gateway/conf.d/upstreams/frontend.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/postyfox/prod/gateway/conf.d/upstreams/frontend.conf || { echo "❌ Failed to copy upstream fragment"; exit 1; }
          scp -P ${{ env.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            deploy/gateway/conf.d/routes/90-root.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/postyfox/prod/gateway/conf.d/routes/90-root.conf || { echo "❌ Failed to copy root route fragment"; exit 1; }

      - name: Deploy frontend to prod stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "🚀 Deploying frontend to prod stack (⚠️ PRODUCTION)..."
          ssh -p ${{ env.DEPLOY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "set -e; \
            cd /opt/postyfox/prod && \
            echo '📋 Checking .env file exists...' && \
            [ -f .env ] || { echo '❌ Missing .env file (core stack not initialised?)'; exit 1; }; \
            source .env 2>/dev/null || true; \
            export FRONTEND_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }} && \
            export FRONTEND_IMAGE_TAG=${{ env.IMAGE_TAG }} && \
            export COMPOSE_PROJECT_NAME=postyfox-prod && \
            COMPOSE_FILES='-f docker-compose.server.yml -f docker-compose.prod.yml -f docker-compose.frontend.server.yml' && \
            echo '🔄 Pulling frontend image...' && \
            docker compose \$COMPOSE_FILES pull frontend || { echo '❌ Failed to pull frontend image'; exit 1; }; \
            echo '⬆️ Updating frontend service...' && \
            docker compose \$COMPOSE_FILES up -d --no-deps frontend || { echo '❌ Failed to start frontend'; exit 1; }; \
            echo '🔄 Reloading gateway (conf.d fragments are bind-mounted; restart picks up the SPA route)...' && \
            docker compose \$COMPOSE_FILES restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }; \
            echo '✅ Prod frontend deployed successfully' && \
            docker compose \$COMPOSE_FILES ps frontend gateway" || {
            echo "❌ Prod deployment failed"
            exit 1
          }

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          sleep 15
          ssh -p ${{ env.DEPLOY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd /opt/postyfox/prod && \
            docker compose -f docker-compose.server.yml -f docker-compose.prod.yml -f docker-compose.frontend.server.yml ps frontend | grep -E '(Up|healthy)' || { \
            echo '⚠️ Warning: frontend may not be healthy yet'; }; \
            true"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        if: success()
        run: |
          cat << 'EOF'
          ✅ Production frontend deployment completed successfully!

          📊 Stack Information:
          - Environment: Production (approval-gated)
          - Project: postyfox-prod
          - Location: /opt/postyfox/prod
          - Image: ${{ steps.image.outputs.repository }}:${{ github.event.workflow_run.head_sha }}

          📝 Check logs:
          - ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} "cd /opt/postyfox/prod && docker compose logs -f frontend"
          EOF
