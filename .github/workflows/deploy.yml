name: Deploy

# Ships images already built by Build; nothing is rebuilt here.
#   development: automatic after every successful main Build, or manual for any built commit
#   production:  manual only, and only for built commits on main.
#                Optionally tags vX.Y.Z (the version baked in at build) and publishes a GitHub Release.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, production]
        default: development
      sha:
        description: Commit to deploy (blank = newest built commit on main)
        required: false
        type: string
      release:
        description: Production only. Tag vX.Y.Z and publish a GitHub Release after deploying
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/postyfox/postyfox-frontend

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve environment
        id: target
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: echo "environment=${INPUT_ENVIRONMENT:-development}" >> "$GITHUB_OUTPUT"

      # SHA-tagged images exist only for commits Build validated and pushed
      - name: Resolve commit
        id: resolve
        uses: aneillans/github-templates/actions/resolve-deploy@v1
        with:
          images: |
            ghcr.io/postyfox/postyfox-frontend
          run_sha: ${{ github.event.workflow_run.head_sha }}
          sha: ${{ inputs.sha }}
          require_branch: ${{ steps.target.outputs.environment == 'production' && 'main' || '' }}
          version_env: APP_VERSION
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

  development:
    needs: resolve
    if: needs.resolve.outputs.environment == 'development'
    runs-on: [self-hosted]
    environment: development
    concurrency: deploy-development-frontend
    env:
      STACK_DIR: /opt/postyfox/dev
      COMPOSE_PROJECT_NAME: postyfox-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Copy deployment files
        run: |
          # The runner is on the dev host, so write straight into core's stack
          mkdir -p "$STACK_DIR"/gateway/conf.d/upstreams "$STACK_DIR"/gateway/conf.d/routes
          cp deploy/docker-compose.frontend.server.yml "$STACK_DIR"/
          cp deploy/gateway/conf.d/upstreams/frontend.conf "$STACK_DIR"/gateway/conf.d/upstreams/frontend.conf
          cp deploy/gateway/conf.d/routes/90-root.conf "$STACK_DIR"/gateway/conf.d/routes/90-root.conf

      - name: Deploy frontend to dev stack
        env:
          IMAGE_TAG: ${{ needs.resolve.outputs.sha }}
        run: |
          cd "$STACK_DIR"
          [ -f .env ] || { echo "::error::Missing $STACK_DIR/.env (core stack not initialised?)"; exit 1; }
          # .env may pin the frontend image; the workflow's values win
          wf_repository="$IMAGE_REPOSITORY"; wf_tag="$IMAGE_TAG"
          source .env 2>/dev/null || true
          export FRONTEND_IMAGE_REPOSITORY="$wf_repository" FRONTEND_IMAGE_TAG="$wf_tag"
          compose() { docker compose -f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml "$@"; }
          compose pull frontend
          compose up -d --no-deps frontend
          # conf.d fragments are bind-mounted; restart picks up the SPA route
          compose restart gateway
          compose ps frontend gateway

  production:
    needs: resolve
    if: needs.resolve.outputs.environment == 'production'
    concurrency: deploy-production-frontend
    uses: aneillans/github-templates/.github/workflows/helm-deploy.yml@v1
    with:
      environment: production
      # cluster API is only reachable from the self-hosted runner
      runs_on: self-hosted
      ref: ${{ needs.resolve.outputs.sha }}
      chart: deploy/helm/postyfox-frontend
      release: postyfox-frontend
      namespace: postyfox
      values_files: deploy/helm/postyfox-frontend/values-prod.yaml
      set_values: |
        image.repository=ghcr.io/postyfox/postyfox-frontend
        image.tag=${{ needs.resolve.outputs.sha }}
        service.name=postyfox-frontend
    # KUBE_CONFIG is a production environment secret, read by the template job

  release:
    needs: [resolve, production]
    if: inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: aneillans/github-templates/actions/tag-release@v1
        with:
          sha: ${{ needs.resolve.outputs.sha }}
          version: ${{ needs.resolve.outputs.version }}
