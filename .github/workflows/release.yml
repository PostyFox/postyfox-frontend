name: release

# Production release pipeline (semver, Conventional Commits).
#
# Manually dispatched, two modes:
#   • `version` blank  → NEW release: compute the next semver from commit messages, build a
#                        version-stamped image, deploy to DEV, then (after production approval)
#                        tag the repo (vX.Y.Z + GitHub Release) and deploy PROD.
#   • `version` set    → REDEPLOY: skip build + tagging and (re)deploy that EXISTING tag's already
#                        built image. Deploys DEV first, then PROD after approval. Use for rollback
#                        or re-shipping a known-good version.
#
# Everyday pushes to main still auto-deploy DEV via frontend-ci + deploy.yml; only this workflow
# touches production. Versioned independently of postyfox-core.
#
# DEV stays on docker-compose (self-hosted runner) — the frontend image is dropped into the same
# compose stack as core. PROD deploys as its OWN Helm release (deploy/helm/postyfox-frontend) into
# the SAME namespace/cluster as postyfox-core's release, using a kubeconfig stored in the
# `production` GitHub Environment's secrets. postyfox-core's gateway proxies "/" to this release's
# Service (see postyfox-core's values-prod.yaml `gateway.frontend.*`) — nothing here needs to know
# about core beyond deploying into the same namespace.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag/version to (re)deploy, e.g. 2.1.0 (the leading v is optional). Leave BLANK to cut a new release from the latest commits."
        required: false
        type: string

permissions:
  contents: write   # push the release tag + create the GitHub Release
  packages: write   # push the image to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}   # bare semver, no leading v
      ref: ${{ steps.resolve.outputs.ref }}           # git ref the deploy jobs check out
      is_new: ${{ steps.resolve.outputs.is_new }}     # 'true' = new release; 'false' = redeploy
      needs_build: ${{ steps.image_check.outputs.needs_build }}   # 'true' if the semver image must be (re)built
      build_sha: ${{ steps.image_check.outputs.build_sha }}       # commit SHA actually being built (== ref, resolved)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version (Conventional Commits)
        id: semver
        if: inputs.version == ''
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          # Conventional Commits: `type!:` or BREAKING CHANGE → major; `feat:` → minor; else patch.
          major_pattern: '/^\w+(\(.+\))?!:|BREAKING CHANGE/'
          minor_pattern: '/^feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: true
      - name: Resolve version + mode
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"                       # accept 2.1.0 or v2.1.0
            if ! git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
              echo "❌ Tag v${V} not found — cannot redeploy a version that was never released."; exit 1
            fi
            echo "version=${V}" >> "$GITHUB_OUTPUT"
            echo "ref=v${V}" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "🔁 Redeploying existing release v${V}"
          else
            echo "version=${{ steps.semver.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "🆕 New release version ${{ steps.semver.outputs.version }}"
          fi
      - name: Check whether the image needs (re)building
        # A git tag existing does NOT guarantee its semver-tagged image was ever pushed to GHCR
        # (e.g. a tag created before this pipeline existed, or created outside of it). Rather than
        # silently deploying a differently-versioned image (or failing deep inside `docker compose
        # pull`), rebuild from the tagged commit whenever the semver image is missing so the
        # correct version is baked into the image (and therefore the footer) either way.
        id: image_check
        env:
          IS_NEW: ${{ steps.resolve.outputs.is_new }}
          VERSION: ${{ steps.resolve.outputs.version }}
          REF: ${{ steps.resolve.outputs.ref }}
        run: |
          BUILD_SHA="$(git rev-parse "$REF")"
          echo "build_sha=${BUILD_SHA}" >> "$GITHUB_OUTPUT"

          if [ "$IS_NEW" = "true" ]; then
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "🆕 New release — will build a fresh image."
            exit 0
          fi

          IMAGE_REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null
          if docker manifest inspect "ghcr.io/${IMAGE_REPOSITORY}:${VERSION}" >/dev/null 2>&1; then
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "✅ Found published image ghcr.io/${IMAGE_REPOSITORY}:${VERSION} — reusing it."
          else
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ No image published for v${VERSION} (tag exists but was never built) — rebuilding from ${REF} (commit ${BUILD_SHA}) so the correct version is baked in."
          fi

  build:
    # Builds whenever there's no already-published, correctly-versioned image: always for a new
    # release, and for a redeploy only if that version's image was never actually pushed.
    needs: compute-version
    if: needs.compute-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}
      - name: Normalize image repository name
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Tag with the semver AND the actual built commit SHA for traceability. Note this is
          # NOT necessarily `github.sha` — a rebuild-on-redeploy builds the tagged commit, which
          # may differ from the commit that triggered this workflow run.
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ needs.compute-version.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ needs.compute-version.outputs.build_sha }}
          build-args: |
            BUILD_ENV=production
            VERSION=${{ needs.compute-version.outputs.version }}

  deploy-dev:
    # Release artifacts MUST prove out on dev before prod. Runs whether we (re)built the image
    # this run or are redeploying an already-published, correctly-versioned one (build skipped).
    needs: [compute-version, build]
    if: |
      always() &&
      needs.compute-version.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted]
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}

      - name: Resolve image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files
        run: |
          echo "📦 Copying frontend overlay + gateway fragments to dev stack..."
          mkdir -p /opt/postyfox/dev/gateway/conf.d/upstreams /opt/postyfox/dev/gateway/conf.d/routes
          cp deploy/docker-compose.frontend.server.yml /opt/postyfox/dev/
          cp deploy/gateway/conf.d/upstreams/frontend.conf /opt/postyfox/dev/gateway/conf.d/upstreams/frontend.conf
          cp deploy/gateway/conf.d/routes/90-root.conf /opt/postyfox/dev/gateway/conf.d/routes/90-root.conf

      - name: Deploy frontend to dev stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          echo "🚀 Deploying release ${IMAGE_TAG} to dev stack..."
          set -e
          cd /opt/postyfox/dev
          [ -f .env ] || { echo '❌ Missing .env file (core stack not initialised?)'; exit 1; }
          source .env 2>/dev/null || true
          export FRONTEND_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
          export FRONTEND_IMAGE_TAG=${{ env.IMAGE_TAG }}
          export COMPOSE_PROJECT_NAME=postyfox-dev
          COMPOSE_FILES='-f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml'
          docker compose $COMPOSE_FILES pull frontend || { echo '❌ Failed to pull frontend image'; exit 1; }
          docker compose $COMPOSE_FILES up -d --no-deps frontend || { echo '❌ Failed to start frontend'; exit 1; }
          docker compose $COMPOSE_FILES restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }
          echo '✅ Dev frontend updated to release build'
          docker compose $COMPOSE_FILES ps frontend gateway

      - name: Health check
        run: |
          sleep 10
          cd /opt/postyfox/dev && \
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml ps frontend | grep -E '(Up|healthy)' || { \
          echo '⚠️ Warning: frontend may not be healthy yet'; }; \
          true

  deploy-prod:
    # Approval-gated via the `production` GitHub environment.
    needs: [compute-version, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    env:
      NAMESPACE: postyfox
      RELEASE_NAME: postyfox-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}

      - name: Resolve image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag release + publish GitHub Release
        # New releases only — a redeploy targets an existing tag, so there's nothing to tag.
        # Runs post-approval (this whole job is gated by the `production` environment) but BEFORE
        # the deploy, so the tag exists the moment we ship to prod.
        if: needs.compute-version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          echo "🏷️ Tagged and released v${VERSION}"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Configure kubeconfig
        # Uses the SAME kubeconfig secret as postyfox-core's release pipeline (this release is
        # deployed into that same cluster/namespace) — a service-account token scoped to the
        # `postyfox` namespace is strongly recommended over a personal/admin credential.
        run: |
          mkdir -p "$RUNNER_TEMP/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$RUNNER_TEMP/.kube/config"
          chmod 600 "$RUNNER_TEMP/.kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Helm upgrade --install (⚠️ PRODUCTION)
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          echo "🚀 Deploying release v${IMAGE_TAG} to prod k8s (namespace: ${NAMESPACE})..."
          helm upgrade --install "$RELEASE_NAME" deploy/helm/postyfox-frontend \
            --namespace "$NAMESPACE" --create-namespace \
            --set image.repository="$IMAGE_REPOSITORY" \
            --set image.tag="${IMAGE_TAG}" \
            --set service.name="$RELEASE_NAME" \
            --atomic --wait --timeout 5m \
            || { echo "❌ Helm upgrade failed (auto-rolled back by --atomic)"; exit 1; }
          echo "✅ Prod frontend release v${IMAGE_TAG} deployed"

      - name: Health check
        run: |
          kubectl -n "$NAMESPACE" get pods -l app.kubernetes.io/name=postyfox-frontend
          kubectl -n "$NAMESPACE" rollout status deployment/"$RELEASE_NAME" --timeout=60s || \
            echo "⚠️ Warning: frontend rollout not confirmed healthy within timeout"

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/.kube/config"
