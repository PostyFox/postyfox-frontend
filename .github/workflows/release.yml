name: release

# Production release pipeline (semver, Conventional Commits).
#
# Manually dispatched, two modes:
#   • `version` blank  → NEW release: compute the next semver from commit messages, build a
#                        version-stamped image, deploy to DEV, then (after production approval)
#                        tag the repo (vX.Y.Z + GitHub Release) and deploy PROD.
#   • `version` set    → REDEPLOY: skip build + tagging and (re)deploy that EXISTING tag's already
#                        built image. Deploys DEV first, then PROD after approval. Use for rollback
#                        or re-shipping a known-good version.
#
# Everyday pushes to main still auto-deploy DEV via frontend-ci + deploy.yml; only this workflow
# touches production. Versioned independently of postyfox-core.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag/version to (re)deploy, e.g. 2.1.0 (the leading v is optional). Leave BLANK to cut a new release from the latest commits."
        required: false
        type: string

permissions:
  contents: write   # push the release tag + create the GitHub Release
  packages: write   # push the image to GHCR

env:
  REGISTRY: ghcr.io
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}   # bare semver, no leading v
      ref: ${{ steps.resolve.outputs.ref }}           # git ref the deploy jobs check out
      is_new: ${{ steps.resolve.outputs.is_new }}     # 'true' = new release (build + tag); 'false' = redeploy
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version (Conventional Commits)
        id: semver
        if: inputs.version == ''
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          # Conventional Commits: `type!:` or BREAKING CHANGE → major; `feat:` → minor; else patch.
          major_pattern: '/^\w+(\(.+\))?!:|BREAKING CHANGE/'
          minor_pattern: '/^feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          search_commit_body: true
      - name: Resolve version + mode
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"                       # accept 2.1.0 or v2.1.0
            if ! git rev-parse -q --verify "refs/tags/v${V}" >/dev/null; then
              echo "❌ Tag v${V} not found — cannot redeploy a version that was never released."; exit 1
            fi
            echo "version=${V}" >> "$GITHUB_OUTPUT"
            echo "ref=v${V}" >> "$GITHUB_OUTPUT"
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "🔁 Redeploying existing release v${V}"
          else
            echo "version=${{ steps.semver.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "🆕 New release version ${{ steps.semver.outputs.version }}"
          fi

  build:
    # New releases build a fresh image; a redeploy reuses the already-published tag.
    needs: compute-version
    if: needs.compute-version.outputs.is_new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Normalize image repository name
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Tag with the semver AND the commit SHA for traceability.
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ needs.compute-version.outputs.version }}
            ghcr.io/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          build-args: |
            BUILD_ENV=production
            VERSION=${{ needs.compute-version.outputs.version }}

  deploy-dev:
    # Release artifacts MUST prove out on dev before prod. Runs whether we built a fresh image
    # (new release) or are redeploying an existing tag (build job skipped).
    needs: [compute-version, build]
    if: |
      always() &&
      needs.compute-version.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted]
    environment: development
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}

      - name: Resolve image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Copy deployment files
        run: |
          echo "📦 Copying frontend overlay + gateway fragments to dev stack..."
          mkdir -p /opt/postyfox/dev/gateway/conf.d/upstreams /opt/postyfox/dev/gateway/conf.d/routes
          cp deploy/docker-compose.frontend.server.yml /opt/postyfox/dev/
          cp deploy/gateway/conf.d/upstreams/frontend.conf /opt/postyfox/dev/gateway/conf.d/upstreams/frontend.conf
          cp deploy/gateway/conf.d/routes/90-root.conf /opt/postyfox/dev/gateway/conf.d/routes/90-root.conf

      - name: Deploy frontend to dev stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          echo "🚀 Deploying release ${IMAGE_TAG} to dev stack..."
          set -e
          cd /opt/postyfox/dev
          [ -f .env ] || { echo '❌ Missing .env file (core stack not initialised?)'; exit 1; }
          source .env 2>/dev/null || true
          export FRONTEND_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }}
          export FRONTEND_IMAGE_TAG=${{ env.IMAGE_TAG }}
          export COMPOSE_PROJECT_NAME=postyfox-dev
          COMPOSE_FILES='-f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml'
          docker compose $COMPOSE_FILES pull frontend || { echo '❌ Failed to pull frontend image'; exit 1; }
          docker compose $COMPOSE_FILES up -d --no-deps frontend || { echo '❌ Failed to start frontend'; exit 1; }
          docker compose $COMPOSE_FILES restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }
          echo '✅ Dev frontend updated to release build'
          docker compose $COMPOSE_FILES ps frontend gateway

      - name: Health check
        run: |
          sleep 10
          cd /opt/postyfox/dev && \
          docker compose -f docker-compose.server.yml -f docker-compose.dev.yml -f docker-compose.frontend.server.yml ps frontend | grep -E '(Up|healthy)' || { \
          echo '⚠️ Warning: frontend may not be healthy yet'; }; \
          true

  deploy-prod:
    # Approval-gated via the `production` GitHub environment.
    needs: [compute-version, deploy-dev]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compute-version.outputs.ref }}

      - name: Resolve image repository
        id: image
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Tag release + publish GitHub Release
        # New releases only — a redeploy targets an existing tag, so there's nothing to tag.
        # Runs post-approval (this whole job is gated by the `production` environment) but BEFORE
        # the deploy, so the tag exists the moment we ship to prod.
        if: needs.compute-version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          echo "🏷️ Tagged and released v${VERSION}"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.DEPLOY_PORT }} ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy deployment files
        run: |
          echo "📦 Copying frontend overlay + gateway fragments to prod stack..."
          ssh -p ${{ env.DEPLOY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "mkdir -p /opt/postyfox/prod/gateway/conf.d/upstreams /opt/postyfox/prod/gateway/conf.d/routes" || {
            echo "❌ Failed to ensure gateway conf.d directories exist"; exit 1; }
          scp -P ${{ env.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            deploy/docker-compose.frontend.server.yml \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/postyfox/prod/ || { echo "❌ Failed to copy compose overlay"; exit 1; }
          scp -P ${{ env.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            deploy/gateway/conf.d/upstreams/frontend.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/postyfox/prod/gateway/conf.d/upstreams/frontend.conf || { echo "❌ Failed to copy upstream fragment"; exit 1; }
          scp -P ${{ env.DEPLOY_PORT }} -i ~/.ssh/deploy_key \
            deploy/gateway/conf.d/routes/90-root.conf \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/opt/postyfox/prod/gateway/conf.d/routes/90-root.conf || { echo "❌ Failed to copy root route fragment"; exit 1; }

      - name: Deploy frontend to prod stack
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          echo "🚀 Deploying release ${IMAGE_TAG} to prod stack (⚠️ PRODUCTION)..."
          ssh -p ${{ env.DEPLOY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "set -e; \
            cd /opt/postyfox/prod && \
            [ -f .env ] || { echo '❌ Missing .env file (core stack not initialised?)'; exit 1; }; \
            source .env 2>/dev/null || true; \
            export FRONTEND_IMAGE_REPOSITORY=${{ env.IMAGE_REPOSITORY }} && \
            export FRONTEND_IMAGE_TAG=${{ env.IMAGE_TAG }} && \
            export COMPOSE_PROJECT_NAME=postyfox-prod && \
            COMPOSE_FILES='-f docker-compose.server.yml -f docker-compose.prod.yml -f docker-compose.frontend.server.yml' && \
            docker compose \$COMPOSE_FILES pull frontend || { echo '❌ Failed to pull frontend image'; exit 1; }; \
            docker compose \$COMPOSE_FILES up -d --no-deps frontend || { echo '❌ Failed to start frontend'; exit 1; }; \
            docker compose \$COMPOSE_FILES restart gateway || { echo '❌ Failed to restart gateway'; exit 1; }; \
            echo '✅ Prod frontend deployed successfully' && \
            docker compose \$COMPOSE_FILES ps frontend gateway" || { echo "❌ Prod deployment failed"; exit 1; }

      - name: Health check
        run: |
          sleep 15
          ssh -p ${{ env.DEPLOY_PORT }} \
            -i ~/.ssh/deploy_key \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} \
            "cd /opt/postyfox/prod && \
            docker compose -f docker-compose.server.yml -f docker-compose.prod.yml -f docker-compose.frontend.server.yml ps frontend | grep -E '(Up|healthy)' || { \
            echo '⚠️ Warning: frontend may not be healthy yet'; }; \
            true"

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key
