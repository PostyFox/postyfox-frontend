<div class="layout-wrapper">
  <!-- Sidebar -->
  <aside class="app-sidebar" [class.show]="sidebarOpen()">
    <a class="app-sidebar__brand" routerLink="/dashboard" (click)="closeSidebar()">
      <span class="brand-logo"><i class="bi bi-send-fill"></i></span>
      <span>PostyFox</span>
    </a>
    <ul class="app-menu">
      <li class="menu-header">Menu</li>
      @for (item of nav; track item.link) {
        <li class="menu-item" routerLinkActive="active">
          <a class="menu-link" [routerLink]="item.link" (click)="closeSidebar()">
            <i class="bi" [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </aside>

  @if (sidebarOpen()) {
    <div class="sidebar-backdrop d-xl-none" (click)="closeSidebar()"></div>
  }

  <!-- Page -->
  <div class="layout-page">
    <nav class="app-navbar">
      <button
        class="btn btn-icon btn-sm navbar-toggle-btn border-0 me-1"
        type="button"
        aria-label="Toggle menu"
        (click)="toggleSidebar()"
      >
        <i class="bi bi-list fs-4"></i>
      </button>

      <a class="btn btn-primary btn-sm d-none d-sm-inline-flex" routerLink="/compose">
        <i class="bi bi-pencil-square me-1"></i> New post
      </a>

      <div class="ms-auto dropdown">
        <button
          class="btn btn-link text-decoration-none d-flex align-items-center gap-2 p-1"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <span class="avatar avatar-sm">{{ initials() }}</span>
          <span class="d-none d-md-flex flex-column text-start lh-1">
            <span class="fw-medium text-body">{{ displayName() }}</span>
            @if (email()) {
              <small class="text-muted-2">{{ email() }}</small>
            }
          </span>
          <i class="bi bi-chevron-down small text-muted-2"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li class="px-3 py-2">
            <div class="fw-medium">{{ displayName() }}</div>
            @if (email()) {
              <small class="text-muted-2">{{ email() }}</small>
            }
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item" routerLink="/keys"> <i class="bi bi-key me-2"></i>API keys </a>
          </li>
          <li>
            <button class="dropdown-item text-danger" type="button" (click)="signOut()">
              <i class="bi bi-box-arrow-right me-2"></i>Sign out
            </button>
          </li>
        </ul>
      </div>
    </nav>

    <main class="content-wrapper">
      <router-outlet />
    </main>

    <footer class="content-footer">
      <span>© {{ year }} PostyFox · Cross-platform posting made simple.</span>
    </footer>
  </div>
</div>
