<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>PostyFox</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="PostyFox — cross-platform post scheduling and distribution."
    />
    <script>
      // Issue #422: apply the stored (or OS) colour scheme before first paint; ThemeService takes over after boot.
      (function () {
        var mode = null;
        try {
          mode = localStorage.getItem('postyfox.theme');
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="256x256" href="logo.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
